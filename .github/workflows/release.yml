name: Release

# A published GitHub release builds the sdist and the wheels and uploads them to PyPI.
# A manual run builds and tests the same files without an upload.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pyproject.toml holds the only version literal, so the tag must match it.
      - env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    strategy:
      fail-fast: false  # one failing platform must not hide the result of the others
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    if: github.event_name == 'release'
    needs: [check-version, sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mesh2sdf2
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
