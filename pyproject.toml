[build-system]
requires = [
    "setuptools>=68",
    "pybind11>=2.13",
]

build-backend = "setuptools.build_meta"

[project]
name = "mesh2sdf2"
version = "2.2.0"
description = "Compute the signed distance field from an input mesh"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Lucas Mosquera", email = "25126199+LuckJMG@users.noreply.github.com"},
    {name = "Peng-Shuai Wang", email = "wangps@hotmail.com"},
]
keywords = ["sdf", "mesh", "signed-distance-field", "pybind11", "3d"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "numpy",
    "trimesh",
    "scikit-image",
]

[project.urls]
Homepage = "https://github.com/LuckJMG/mesh2sdf2"
Source = "https://github.com/LuckJMG/mesh2sdf2"
Issues = "https://github.com/LuckJMG/mesh2sdf2/issues"
Upstream = "https://github.com/wang-ps/mesh2sdf"

[tool.setuptools.packages.find]
where = ["."]
include = ["mesh2sdf*"]

[dependency-groups]
dev = [
    "matplotlib",
    "pybind11>=2.13",
    "pytest",
    "pytest-benchmark",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "--benchmark-disable"
